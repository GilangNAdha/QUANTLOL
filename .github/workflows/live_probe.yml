name: live-data-probe
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "tools/probe/live_data_probe.py"
      - ".github/workflows/live_probe.yml"
      - "signals/providers.py"
      - "signals/datafeed.py"
      - "signals/config.py"
      - "tests/test_signals.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/afc8c595-quantlol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe endpoints
        run: python3 tools/probe/live_data_probe.py --out tools/probe/out
      - name: Commit results
        run: |
          git config user.email "ci@quantlol.local"; git config user.name "QuantLOL CI"
          git add -f tools/probe/out/live_probe.json tools/probe/out/live_probe.md
          git commit -q -m "probe: live data endpoint results [skip ci]" || echo nothing
          git pull --rebase -q || true
          git push origin HEAD:arena/afc8c595-quantlol

  # End-to-end proof that the signal app itself can read a real venue feed.
  # The sandbox used for development has no outbound network, so this is the only place
  # a live bar can actually reach the engine.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/afc8c595-quantlol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest tests.test_signals
      - name: Fail on any pipe error
        run: echo "SHELLOPTS=${SHELLOPTS:-}"; python3 --version
      - name: Doctor (BTC, keyless Binance)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python3 -m signals --preset btc --data-mode live --provider binance doctor | tee build/live_doctor_btc.txt
      - name: Evaluate one live BTC bar
        run: |
          mkdir -p build
          python3 -m signals --preset btc --data-mode live --provider binance once --json > build/live_once_btc.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("build/live_once_btc.json"))
          latest = d.get("latest") or {}
          feed = d.get("data") or {}
          print("state=%s reason=%s bars=%s source=%s last=%s" % (
              latest.get("state"), latest.get("reason"), feed.get("bars"),
              feed.get("source"), feed.get("last_bar_utc")))
          assert latest.get("state") not in (None, "unavailable"), "engine could not evaluate a live bar"
          assert (feed.get("bars") or 0) > 50, "not enough live bars"
          PY
      - name: Fallback chain (provider unset)
        shell: bash
        run: |
          set -o pipefail
          python3 -m signals --preset btc --data-mode live --provider coinbase doctor | tee build/live_doctor_coinbase.txt
      - name: Deribit options positioning (BTC)
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' | tee build/live_gex_btc.txt
          from signals.config import SignalConfig
          from signals import datafeed, providers
          c = SignalConfig().apply_preset("btc")
          c.enable_gex, c.gex_source = True, "deribit"
          bars, meta = providers.fetch("binance", "BTCUSDT", 5, limit=5)
          st = datafeed.load_gex_deribit(c, spot=bars[-1].c)
          print(st.status)
          print(st.data["note"] if st.data else "")
          for lv in (st.data or {}).get("levels", []):
              print("  %-10s %.2f" % (lv["kind"], lv["price"]))
          assert st.available, "Deribit chain unavailable"
          PY
      - name: Commit evidence
        run: |
          git config user.email "ci@quantlol.local"; git config user.name "QuantLOL CI"
          git add -f build/live_doctor_btc.txt build/live_doctor_coinbase.txt build/live_doctor_kraken.txt build/live_once_btc.json build/live_gex_btc.txt
          git commit -q -m "probe: live signal-app smoke results [skip ci]" || echo nothing
          git pull --rebase -q || true
          git push origin HEAD:arena/afc8c595-quantlol
