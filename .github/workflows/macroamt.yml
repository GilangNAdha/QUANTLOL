name: macroamt

# Compile the MacroAmtSwingBot against the real cTrader.Automate package and run the
# pure-core unit tests (the bot file is compiled with MACROAMT_CORE_ONLY for the tests,
# so the tested code is exactly the code the bot runs).
on:
  push:
    branches: ["**"]
    paths:
      - "src/MacroAmtSwingBot/**"
      - "tests/MacroAmt.Tests/**"
      - ".github/workflows/macroamt.yml"
  pull_request:
    paths:
      - "src/MacroAmtSwingBot/**"
      - "tests/MacroAmt.Tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Build cBot (net6.0 + cTrader.Automate 1.0.21)
        run: dotnet build src/MacroAmtSwingBot/MacroAmtSwingBot.csproj -c Release --nologo -v m

      - name: Unit tests (pure core, tanpa cAlgo)
        run: |
          set +e
          dotnet test tests/MacroAmt.Tests/MacroAmt.Tests.csproj -c Release --nologo -v n > test_out.txt 2>&1
          RC=$?
          echo "TEST_EXIT=$RC"
          cat test_out.txt
          if [ $RC -ne 0 ]; then
            # ringkas kegagalan jadi anotasi supaya mudah dibaca dari ringkasan run
            grep -E "^  Failed MacroAmt|Error Message|Assert\.|Expected:|Actual:|error CS" test_out.txt | head -120 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $RC
