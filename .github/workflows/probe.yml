name: probe
on:
  push:
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Toolchain
        run: |
          dotnet --list-sdks
          python3 -V
      - name: API dump
        run: |
          set -e
          mkdir -p /tmp/api && cd /tmp/api
          dotnet new console -o dump --force >/dev/null
          cp "$GITHUB_WORKSPACE/tools/probe/DumpApi.cs" dump/Program.cs
          cd dump
          dotnet add package cTrader.Automate --version 1.0.21 >/dev/null
          dotnet build -c Release -v q --nologo
          DLL=$(find ~/.nuget/packages/ctrader.automate -name 'cAlgo.API.dll' | head -1)
          echo "DLL=$DLL"
          dotnet run -c Release --no-build -- "$DLL"
      - name: Data probe
        run: python3 tools/probe/probe_data.py
